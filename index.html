<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨境转账省钱比对工具(多币种版)</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 420px; box-sizing: border-box; }
        h2 { text-align: center; color: #1c1c1e; margin-top: 0; font-size: 20px; margin-bottom: 20px; }
        .tab-group { display: flex; background: #e3e3e6; border-radius: 12px; padding: 3px; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 9px; font-weight: bold; color: #636366; font-size: 13px; transition: all 0.2s; }
        .tab.active { background: white; color: #007aff; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #3a3a3c; font-size: 14px; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 10px; background: #f2f2f7; box-sizing: border-box; font-size: 16px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #007aff; background: white; }
        .radio-group { display: flex; gap: 20px; margin-bottom: 16px; background: #f2f2f7; padding: 12px; border-radius: 10px; }
        .radio-item { display: flex; align-items: center; gap: 6px; font-size: 15px; cursor: pointer; color: #1c1c1e; }
        .radio-item input { width: auto; margin: 0; }
        button { width: 100%; padding: 14px; background: #007aff; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 12px rgba(0,122,255,0.2); }
        button:hover { background: #0063cc; }
        #result { margin-top: 20px; padding: 16px; background: #f2f2f7; border-radius: 12px; border-left: 5px solid #007aff; white-space: pre-line; font-size: 14px; color: #1c1c1e; line-height: 1.6; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>跨境转账省钱比对工具</h2>
        
        <!-- 1. 选择转账方向 -->
        <div class="tab-group">
            <div id="tab-out" class="tab active" onclick="switchDirection(true)">外币 ➔ 🇨🇳 人民币(结汇回国)</div>
            <div id="tab-in" class="tab" onclick="switchDirection(false)">🇨🇳 人民币 ➔ 外币(外汇输出)</div>
        </div>

        <!-- 2. 选择目标/源头货币 -->
        <label>选择对比的外币币种：</label>
        <div class="radio-group">
            <label class="radio-item">
                <input type="radio" name="currency" value="IDR" checked onclick="updateLabels()">
                🇮🇩 印尼盾 (IDR)
            </label>
            <label class="radio-item">
                <input type="radio" name="currency" value="USD" onclick="updateLabels()">
                🇺🇸 美元 (USD)
            </label>
        </div>

        <!-- 3. 输入框 -->
        <div class="input-group">
            <label id="amount-label">输入汇出金额</label>
            <input type="number" id="amount" placeholder="输入数字">
        </div>
        <div class="input-group">
            <label id="rate-label">输入当前参考汇率</label>
            <input type="number" id="rate" step="0.0001" placeholder="根据外币类型输入">
        </div>

        <button onclick="calculate()">开始精算比对</button>
        <div id="result"></div>
    </div>

    <script>
        let isTransferToCny = true; // true: 汇款回中国, false: 人民币汇出国外

        // 各种费率常量配置
        const BANK_FIXED_FEE_CNY = 150.0;   // 银行国内汇出固定电汇费
        const BANK_SPREAD = 0.012;          // 银行点差损耗 1.2%
        
        const TOPREMIT_FEE_IDR_TO_CNY = 100000.0; // Topremit印尼盾转中国固定手续费
        const TOPREMIT_FEE_USD_TO_CNY = 5.0;      // Topremit美元转中国固定手续费 [参考1]
        const TOPREMIT_FEE_CNY_TO_USD = 35.0;     // Topremit人民币转境外美元手续费预估
        const TOPREMIT_SPREAD = 0.004;            // Topremit点差损耗 0.4%

        function switchDirection(direction) {
            isTransferToCny = direction;
            document.getElementById('tab-out').classList.toggle('active', direction);
            document.getElementById('tab-in').classList.toggle('active', !direction);
            updateLabels();
        }

        function updateLabels() {
            const currency = document.querySelector('input[name="currency"]:checked').value;
            const amountLabel = document.getElementById('amount-label');
            const rateLabel = document.getElementById('rate-label');
            
            document.getElementById('amount').value = '';
            document.getElementById('rate').value = '';
            document.getElementById('result').style.display = 'none';

            if (isTransferToCny) {
                // 外币转人民币
                amountLabel.innerText = `输入汇出金额 (${currency})`;
                rateLabel.innerText = currency === 'IDR' ? '输入参考汇率 (1 CNY = ? IDR)' : '输入参考汇率 (1 USD = ? CNY)';
            } else {
                // 人民币转外币
                amountLabel.innerText = '输入汇出金额 (CNY)';
                rateLabel.innerText = currency === 'IDR' ? '输入参考汇率 (1 CNY = ? IDR)' : '输入参考汇率 (1 CNY = ? USD)';
            }
        }

        function calculate() {
            const amount = parseFloat(document.getElementById('amount').value);
            const userRate = parseFloat(document.getElementById('rate').value);
            const currency = document.querySelector('input[name="currency"]:checked').value;
            const resultDiv = document.getElementById('result');

            if (!amount || amount <= 0 || !userRate || userRate <= 0) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '⚠️ 请输入有效的转账金额和当前参考汇率';
                return;
            }

            let text = '';

            if (isTransferToCny) {
                // ==========================================
                // 【场景：外币转回中国结汇成人民币 CNY】
                // ==========================================
                if (currency === 'IDR') {
                    // 印尼盾转人民币
                    const baseCnyRate = 1 / userRate;
                    const topremitReceivedCny = (amount - TOPREMIT_FEE_IDR_TO_CNY) * baseCnyRate * (1 - TOPREMIT_SPREAD);
                    const bankReceivedCny = (amount - 300000.0) * baseCnyRate * (1 - BANK_SPREAD); // 银行扣30万印尼盾
                    const diff = Math.abs(bankReceivedCny - topremitReceivedCny);
                    const winner = topremitReceivedCny > bankReceivedCny ? '【Topremit】' : '【银行直转】';

                    text = `📊 <b>[参考汇率]</b> 10k IDR = ${(baseCnyRate * 10000).toFixed(4)} CNY\n` +
                           `----------------------------------\n` +
                           `● <b>Topremit 到账:</b> ￥${topremitReceivedCny.toFixed(2)}\n  <small>(扣 100,000 IDR 手续费)</small>\n\n` +
                           `● <b>银行直转到账:</b> ￥${bankReceivedCny.toFixed(2)}\n  <small>(预估扣 300,000 IDR 境外电汇费)</small>\n` +
                           `----------------------------------\n` +
                           `💡 <b>结论:</b> <span style="color:#007aff;font-weight:bold;">${winner}</span> 更省钱！\n` +
                           `您可多收到约: <span style="color:#28a745;font-weight:bold;">￥${diff.toFixed(2)}</span>`;
                } else {
                    // 美元转人民币
                    const topremitReceivedCny = (amount - TOPREMIT_FEE_USD_TO_CNY) * userRate * (1 - TOPREMIT_SPREAD);
                    const bankReceivedCny = (amount - 25.0) * userRate * (1 - BANK_SPREAD); // 银行境外电汇扣$25中转费
                    const diff = Math.abs(bankReceivedCny - topremitReceivedCny);
                    const winner = topremitReceivedCny > bankReceivedCny ? '【Topremit】' : '【银行直转】';

                    text = `📊 <b>[参考汇率]</b> 1 USD = ${userRate.toFixed(4)} CNY\n` +
                           `----------------------------------\n` +
                           `● <b>Topremit 到账:</b> ￥${topremitReceivedCny.toFixed(2)}\n  <small>(扣 $5 固定手续费)</small>\n\n` +
                           `● <b>银行直转到账:</b> ￥${bankReceivedCny.toFixed(2)}\n  <small>(预估扣 $25 中转及电汇费)</small>\n` +
                           `----------------------------------\n` +
                           `💡 <b>结论:</b> <span style="color:#007aff;font-weight:bold;">${winner}</span> 更省钱！\n` +
                           `您可多收到约: <span style="color:#28a745;font-weight:bold;">￥${diff.toFixed(2)}</span>`;
                }
            } else {
                // ==========================================
                // 【场景：从中国人民币汇款到国外】
                // ==========================================
                if (currency === 'IDR') {
                    // 人民币转印尼盾
                    const bankRate = userRate * (1 - BANK_SPREAD);
                    const bankReceivedIdr = (amount - BANK_FIXED_FEE_CNY) * bankRate;
                    const topremitRate = userRate * (1 - TOPREMIT_SPREAD);
                    const topremitReceivedIdr = (amount - 50.0) * topremitRate; // 平台人民币手续费约折合50元
                    const diff = Math.abs(bankReceivedIdr - topremitReceivedIdr);
                    const winner = topremitReceivedIdr > bankReceivedIdr ? '【Topremit】' : '【银行直转】';

                    text = `📊 <b>[参考汇率]</b> 1 CNY = ${userRate.toFixed(2)} IDR\n` +
                           `----------------------------------\n` +
                           `● <b>银行直转到账:</b> ${Math.round(bankReceivedIdr).toLocaleString()} IDR\n  <small>(扣除约￥150手续费及点差)</small>\n\n` +
                           `● <b>Topremit 到账:</b> ${Math.round(topremitReceivedIdr).toLocaleString()} IDR\n  <small>(享受平台专享汇率)</small>\n` +
                           `----------------------------------\n` +
                           `💡 <b>结论:</b> <span style="color:#007aff;font-weight:bold;">${winner}</span> 更省钱！\n` +
